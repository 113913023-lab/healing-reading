<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心靈棲所｜甜點心情選書</title><style>*{box-sizing:border-box}body{margin:0;background:#f7efe3;color:#493324;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}main{max-width:850px;margin:30px auto;padding:25px}header{text-align:center}h1{font-size:clamp(26px,5vw,43px);margin:8px}p{line-height:1.8}.subtitle{color:#806652}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.choice{cursor:pointer;border:2px solid #ddc6a7;background:#fff9ef;border-radius:18px;padding:23px 10px;font-size:20px;color:#493324;box-shadow:0 5px 15px #8e64401a}.choice:hover,.choice[aria-pressed=true]{border-color:#9b6038;background:#ffedcf}.emoji{display:block;font-size:58px;margin-bottom:10px}.result{display:none;background:#fffaf2;border:2px solid #e0c5a1;border-radius:22px;padding:28px;box-shadow:0 8px 22px #8e64401c}.result.visible{display:block}.tag{display:inline-block;background:#e8d4b8;border-radius:30px;padding:6px 14px;color:#5a3e27}h2{font-size:27px}h3{margin-bottom:4px}.note{font-size:13px;color:#806652;text-align:center;margin-top:22px}@media(max-width:560px){main{margin:0;padding:16px}.options{gap:8px}.choice{font-size:15px;padding:16px 5px}.emoji{font-size:38px}.result{padding:18px}}</style></head><body><main><header><div style="font-size:35px">☕</div><h1>今天想來點什麼？</h1><p class="subtitle">每一份甜點，都有不同的心情滋味。<br>選一款最吸引你的甜點，遇見今天的療癒故事。</p></header><section class="options" aria-label="選擇甜點"><button class="choice" aria-pressed="false" data-id="lemon"><span class="emoji">🍋</span>檸檬塔</button><button class="choice" aria-pressed="false" data-id="choco"><span class="emoji">🍫</span>巧克力塔</button><button class="choice" aria-pressed="false" data-id="strawberry"><span class="emoji">🍰</span>草莓鮮奶油蛋糕</button></section><section id="result" class="result" aria-live="polite"><span class="tag" id="mood"></span><h2 id="title"></h2><p id="intro"></p><h3>📖 今天的閱讀推薦</h3><p id="book"></p><p id="description"></p><h3>🌿 給自己的小小練習</h3><p id="action"></p><button class="choice" style="padding:10px 20px;font-size:16px;margin-top:12px" onclick="window.scrollTo({top:0,behavior:'smooth'})">再選一道甜點 ↑</button></section><p class="note">《心靈棲所：閱讀與療癒的空間體驗》｜甜點與心情的連結是策展引導，並非心理測驗或診斷。</p></main><script>const data={lemon:{mood:'想換個心情',title:'檸檬塔｜為生活加一點清新',intro:'酸酸甜甜的檸檬塔，像是提醒我們：生活偶爾需要換個角度，才能發現新的風景。',book:'《星期一的抹茶咖啡店》',description:'一間咖啡店牽起人與人的相遇，讓日常中的偶然成為溫柔的驚喜。',action:'今天試著走一條不同的路，或為自己安排一件小小的新鮮事。'},choco:{mood:'需要一點力量',title:'巧克力塔｜給自己一點深厚的安慰',intro:'濃郁的巧克力滋味，適合想補充能量、需要被好好接住的時刻。',book:'《深夜食堂》',description:'深夜的小店裡，一道道熟悉的料理陪伴不同的人生故事；食物有時也是理解與安慰。',action:'回想一道曾經安慰你的料理，也許可以找個時間再次品嚐。'},strawberry:{mood:'想被溫柔對待',title:'草莓鮮奶油蛋糕｜留一份甜給自己',intro:'柔軟的蛋糕與香甜草莓，像是一份不必特別理由的小小犒賞。',book:'《蝸牛食堂》',description:'透過料理與款待，人與人重新建立連結，也慢慢找回面對生活的力量。',action:'今天替自己準備一份喜歡的點心，專心享受幾分鐘，不急著做下一件事。'}};document.querySelectorAll('.choice[data-id]').forEach(b=>b.addEventListener('click',()=>{const d=data[b.dataset.id];document.querySelectorAll('.choice[data-id]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));for(const k of ['mood','title','intro','book','description','action'])document.getElementById(k).textContent=d[k];document.getElementById('result').classList.add('visible');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});}));</script></body></html>
